plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jason.frenchtalk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jason.frenchtalk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebSocket client for the Gemini Live API (the only external dependency)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
